# generation/report_spec.yaml
# Maps each report section to analysis data paths and generation parameters.
#
# part_8 (Kling Index — Product Outcomes) has NO entry below -- this is
# intentional, not a gap. It's computed and stored in analysis_results.json
# for the dashboard UI only; it has never had a written-report section. See
# analysis_engine/sections/part_8.py's module docstring for the full rationale.

schema_version: "1.0"
run_id_default: "2026_Q2"
output_filename: "VFI_Insurance_Impact_Report_2026_Q2.docx"
model: "gemini-2.5-pro"

# R-002 -- the Executive Summary headline-numbers table's metric list, moved
# out of generation/executive_summary.py's old hardcoded _HEADLINE_METRICS
# into config. Same shape precedent as part_10.trend_indicators below: an
# ordered list of dicts, read fresh by generation/executive_summary.py's
# headline_numbers() rather than passed in from a shared parsed object (same
# reload-per-call pattern orchestrator.py already uses for this same file).
#
# base_label is null for a metric whose n_path is the full sample, or a short
# phrase for one whose n_path is a restricted population -- rendered as a
# 4th "Base" column so a reader can tell which rows describe the whole
# portfolio without cross-referencing each part's own population notes.
# Like a report_spec.yaml `population:` entry (see part_1.worth_premium
# below), base_label may instead be a dict keyed by report_scope (plus an
# optional "default"), resolved by the same generation/orchestrator.py
# _resolve_population() every population: note already uses -- worth_premium
# is 100% Health for a LACRO-scoped report (no exclusion to state) but
# restricted to Health & credit-life clients for an Africa/Vietnam-scoped
# one, so its base_label must resolve per-scope exactly like its population
# note does.
executive_summary:
  metrics:
    - key: first_time_access
      label: "First-Time Access to Insurance"
      value_path: "parts.part_3.metrics.no_prior_access.headline.value"
      n_path: "parts.part_3.metrics.no_prior_access.headline.n_valid"
      suppressed_path: "parts.part_3.metrics.no_prior_access.headline.suppressed"
      fmt: "pct"
      base_label: null
    - key: worth_premium
      label: "Worth the Premium"
      value_path: "parts.part_1.metrics.worth_premium.headline.value"
      n_path: "parts.part_1.metrics.worth_premium.headline.n_valid"
      suppressed_path: "parts.part_1.metrics.worth_premium.headline.suppressed"
      fmt: "pct"
      base_label:
        default: "Health & credit-life clients only"
        lacro: null
    - key: claim_process_understanding
      label: "Claim Process Understanding"
      value_path: "parts.part_1.metrics.claim_process_understanding.headline.value"
      n_path: "parts.part_1.metrics.claim_process_understanding.headline.n_valid"
      suppressed_path: "parts.part_1.metrics.claim_process_understanding.headline.suppressed"
      fmt: "pct"
      base_label: null
    - key: child_wellbeing_improved
      label: "Children's Wellbeing Improved"
      value_path: "parts.part_4.child_wellbeing.headline.value"
      n_path: "parts.part_4.child_wellbeing.headline.n_valid"
      suppressed_path: "parts.part_4.child_wellbeing.headline.suppressed"
      fmt: "pct"
      base_label: "clients with children in household"

parts:
  # ───────────────────────────────────────────────────────────────────
  # PART 1 — Product Understanding & Awareness
  # ───────────────────────────────────────────────────────────────────
  part_1:
    title: "Product Understanding & Awareness"
    visuals:
      - file: "part1_coverage_bar.png"
        caption: "Coverage Understanding by Segment"
      - file: "part1_claims_process_bar.png"
        caption: "Claims Process Understanding by Segment"
    sections:
      s1_1:
        label: "Coverage Understanding"
        word_limit: 90
        metrics:
          coverage_understanding:
            path: "parts.part_1.metrics.coverage_understanding.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.coverage_understanding.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.headline.suppressed"
          coverage_understanding_female:
            path: "parts.part_1.metrics.coverage_understanding.segments.female.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.segments.female.suppressed"
          coverage_understanding_male:
            path: "parts.part_1.metrics.coverage_understanding.segments.male.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.segments.male.suppressed"
          coverage_understanding_claimant:
            path: "parts.part_1.metrics.coverage_understanding.segments.claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.segments.claimant.suppressed"
          coverage_understanding_non_claimant:
            path: "parts.part_1.metrics.coverage_understanding.segments.non_claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.segments.non_claimant.suppressed"
          product_understanding:
            path: "parts.part_1.metrics.product_understanding.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.product_understanding.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.product_understanding.headline.suppressed"
          product_understanding_female:
            path: "parts.part_1.metrics.product_understanding.segments.female.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.product_understanding.segments.female.suppressed"
          product_understanding_male:
            path: "parts.part_1.metrics.product_understanding.segments.male.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.product_understanding.segments.male.suppressed"
          product_understanding_claimant:
            path: "parts.part_1.metrics.product_understanding.segments.claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.product_understanding.segments.claimant.suppressed"
          product_understanding_non_claimant:
            path: "parts.part_1.metrics.product_understanding.segments.non_claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.product_understanding.segments.non_claimant.suppressed"
        note: >
          coverage_understanding and product_understanding are two DIFFERENT survey
          instruments used in different country programmes, never both populated in the
          same run -- exactly one of the two will have real data (n_valid > 0) and the
          other will be NOT APPLICABLE (that survey never asked the question). Write about
          whichever one is populated; do not mention the other, do not describe its
          absence, and do not treat this as a missing-data problem. product_understanding
          is a top-2-box: "I know everything" plus "Partially, I know the benefits process
          only" / "Partially, I know the claims process only" (the survey team's confirmed
          rank-2 tier). It is fine to describe it as a top-2-box if that phrasing is useful,
          but do not describe it as "the single most positive response only" -- that was
          the prior, narrower definition and no longer matches what this figure counts.

          The _claimant and _non_claimant figures are restricted to clients who experienced
          an insurable event in the past 12 months (claimant = filed, non_claimant = did not
          file) -- NOT a comparison against clients who never had a claimable event. Phrase
          this as "among clients who filed a claim" / "among clients who experienced an
          event but did not file", never as "those who had not [filed]" on its own (which
          reads as "clients overall, minus claimants") and never implying every respondent
          falls into one of these two groups. Use the phrase "insurable event", never
          "insured event" -- the survey asks whether the client experienced an event that
          MIGHT be covered, not one already determined to be covered.

      s1_2:
        label: "Claim Process Understanding"
        word_limit: 90
        metrics:
          claim_process_understanding:
            path: "parts.part_1.metrics.claim_process_understanding.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.claim_process_understanding.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.headline.suppressed"
          claim_process_understanding_female:
            path: "parts.part_1.metrics.claim_process_understanding.segments.female.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.segments.female.suppressed"
          claim_process_understanding_male:
            path: "parts.part_1.metrics.claim_process_understanding.segments.male.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.segments.male.suppressed"
          claim_process_understanding_claimant:
            path: "parts.part_1.metrics.claim_process_understanding.segments.claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.segments.claimant.suppressed"
          claim_process_understanding_non_claimant:
            path: "parts.part_1.metrics.claim_process_understanding.segments.non_claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.segments.non_claimant.suppressed"
        note: >
          If claim_process_understanding shows NOT APPLICABLE (this survey instrument has
          no separate claim-process-understanding question -- its client understanding is
          captured by the single combined measure already described in the previous
          section), write ONLY a brief 20-30 word acknowledgment of that -- e.g. "This
          programme measures product understanding through a single combined question
          rather than separately for coverage and claims process; see the prior section."
          Do not invent a number, do not repeat the previous section's figure, and do not
          pad this section with generic commentary to reach the word limit.

          The _claimant and _non_claimant figures are restricted to clients who experienced
          an insurable event in the past 12 months (claimant = filed, non_claimant = did not
          file) -- NOT a comparison against clients who never had a claimable event. Phrase
          this as "among clients who filed a claim" / "among clients who experienced an
          event but did not file", never as "those who had not [filed]" on its own.

      s1_2b:
        label: "Preferred Claims Channel"
        word_limit: 70
        metrics:
          channel_preferred_base:
            path: "parts.part_1.claim_channel_preferred.n_base"
            fmt: "count"
        distribution_path: "parts.part_1.claim_channel_preferred.distribution"
        note: >
          This question asks which channel clients PREFER for submitting a claim -- it is
          asked of every respondent regardless of whether they have ever filed a claim.
          It is NOT a record of how any specific claim was actually filed, and must not be
          described as such. Use language like "clients prefer" or "would like to use" --
          never "filed through", "submitted via", or "used".

      s1_3:
        # Generic title (not "...and Renewal Intent") -- renewal_intent is
        # Vietnam/crop-only (see q_renewal_intent's population note below)
        # and never appears at all for a LACRO-scoped report; a title
        # promising content that never renders for that scope is exactly
        # what the module-manifest "omit silently" rule is meant to avoid.
        # worth_premium/renewal_intent's own note (below) already tells the
        # model to write about whichever metrics are actually present.
        label: "Product Value"
        word_limit: 80
        metrics:
          worth_premium:
            path: "parts.part_1.metrics.worth_premium.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.worth_premium.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.worth_premium.headline.suppressed"
            # Scope-conditional (see generation/orchestrator.py's
            # _resolve_population()): LACRO's insurance_type is 100% Health,
            # every client pays premium and was asked this question, so
            # there is no exclusion to describe there at all -- omitted
            # rather than a false "Health & credit-life clients only"
            # caveat, which a real LACRO report showed even though its own
            # products table read 100% Health / 0% Credit Life / 0% Crop.
            population:
              default: "Health & credit-life clients across the African country programmes only; Vietnam's crop-insurance clients pay no premium (grant-subsidized) and were not asked this question"
              lacro: null
          renewal_intent:
            path: "parts.part_1.metrics.renewal_intent.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.renewal_intent.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.renewal_intent.headline.suppressed"
            population: "Vietnam's crop-insurance clients only; this question is not asked of health or credit-life clients in any country"
        note: >
          Any metrics in this section scoped to a restricted population (see each metric's
          population note above, if present) describe entirely separate, non-overlapping
          groups of respondents; never contrast two such metrics as if describing the same
          clients, and do not use transition words like "however" between them. State each
          finding on its own with its stated population.

      insight:
        word_limit: 120
        verbatim_section: "part1"

  # ───────────────────────────────────────────────────────────────────
  # PART 2 — Claims Experience
  # ───────────────────────────────────────────────────────────────────
  part_2:
    title: "Claims Experience"
    visuals:
      - file: "part2_funnel.png"
        caption: "Claims Funnel"
      - file: "part2_no_claim_reasons.png"
        caption: "Reasons for Not Claiming"
      - file: "part2_claim_challenges.png"
        caption: "Top Claims Challenges (% of claimants who challenged)"
    sections:
      s2_1:
        label: "Claims Funnel"
        word_limit: 100
        metrics:
          n_surveyed:
            path: "parts.part_2.claims_funnel.experienced_event.n_total"
            fmt: "count"
          n_experienced_event:
            path: "parts.part_2.claims_funnel.experienced_event.n"
            fmt: "count"
            suppressed_path: "parts.part_2.claims_funnel.experienced_event.suppressed"
          pct_experienced_event:
            path: "parts.part_2.claims_funnel.experienced_event.pct_of_total"
            fmt: "pct"
            suppressed_path: "parts.part_2.claims_funnel.experienced_event.suppressed"
          n_filed_claim:
            path: "parts.part_2.claims_funnel.filed_claim.n"
            fmt: "count"
          pct_filed_of_event:
            path: "parts.part_2.claims_funnel.filed_claim.pct_of_event_base"
            fmt: "pct"
          leakage_rate:
            path: "parts.part_2.claims_funnel.filed_claim.leakage"
            fmt: "pct"
          n_claim_paid:
            path: "parts.part_2.claims_funnel.claim_paid.n"
            fmt: "count"
            suppressed_path: "parts.part_2.claims_funnel.claim_paid.suppressed"
          pct_claim_paid:
            path: "parts.part_2.claims_funnel.claim_paid.pct_of_claimants"
            fmt: "pct"
            suppressed_path: "parts.part_2.claims_funnel.claim_paid.suppressed"
        funnel_table:
          headers: ["Stage", "N", "Rate"]
          rows:
            - label: "Experienced insurable event"
              n_key: "n_experienced_event"
              rate_key: "pct_experienced_event"
            - label: "Filed a claim"
              n_key: "n_filed_claim"
              rate_key: "pct_filed_of_event"
            - label: "Claim paid"
              n_key: "n_claim_paid"
              rate_key: "pct_claim_paid"
        note: >
          Some VisionFund country programmes' survey instruments gate "filed a claim" behind
          a separate "did you experience an insurable event" question (rate expressed as % of
          that event base); others ask about filed claims directly with no such gate (rate
          expressed as % of ALL surveyed clients instead). Never assume which of these applies
          from the report's country or region name -- a given region can appear in this report
          under either behavior depending on which survey instrument produced the data, so
          check strictly by what is actually present in THIS data package, every time:
          if n_experienced_event / pct_experienced_event ARE present above, this programme's
          survey DOES gate on an insurable event -- describe the funnel from insurable event
          through to claim filed, and pct_filed_of_event is the filed-claim rate as a
          percentage of that event base, not of all surveyed clients. If n_experienced_event
          / pct_experienced_event are absent from this data package, this programme's survey
          has no such gate -- write about "filed a claim" directly without mentioning an
          insurable-event step at all, and pct_filed_of_event is then the rate against all
          surveyed clients instead. If n_claim_paid / pct_claim_paid are absent, this
          programme's survey does not collect claim OUTCOME data (paid vs. not) at all -- do
          not say claims were "not paid" or imply a 0% payment rate; state plainly that claim
          outcomes are not tracked in this dataset.

      s2_2:
        label: "Reasons for Not Claiming"
        word_limit: 70
        metrics:
          no_claim_reasons_base:
            path: "parts.part_2.no_claim_reasons.n_base"
            fmt: "count"
            population: "Clients who experienced an insurable event in the last 12 months but did not file a claim -- the same base as Part 6's 'Did not file' group. Not the full non-claiming population; every client here was eligible to claim and chose or was unable to."
        distribution_path: "parts.part_2.no_claim_reasons.distribution"
        qualitative_keys:
          - "other_subthemes.claim_no_reason_other"

      s2_3:
        label: "Claim Challenges"
        word_limit: 80
        metrics:
          challenges_base:
            path: "parts.part_2.claim_challenges.n_base"
            fmt: "count"
        distribution_path: "parts.part_2.claim_challenges.ranked.ranked"
        qualitative_keys:
          - "other_subthemes.claim_challenges_other_support"
          - "protection_flags"
        note: "If any protection_flags were found, surface them briefly in this section."

      s2_4:
        label: "Payout Outcomes"
        word_limit: 100
        metrics:
          claim_result_base:
            path: "parts.part_2.claim_result.n_base"
            fmt: "count"
          payout_cost_base:
            path: "parts.part_2.payout_cost_coverage.n_base"
            fmt: "count"
        distribution_path: "parts.part_2.claim_result.distribution"
        extra_distributions:
          payout_cost_coverage: "parts.part_2.payout_cost_coverage.distribution"

      insight:
        word_limit: 120
        verbatim_section: "part2"

  # ───────────────────────────────────────────────────────────────────
  # PART 3 — Financial Inclusion
  # ───────────────────────────────────────────────────────────────────
  part_3:
    title: "Financial Inclusion"
    visuals:
      - file: "part3_financial_protection.png"
        caption: "Financial Protection Indicators"
    sections:
      s3_0:
        label: "Reaching Clients with No Prior Insurance Access"
        word_limit: 70
        metrics:
          no_prior_access:
            path: "parts.part_3.metrics.no_prior_access.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.no_prior_access.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.no_prior_access.headline.suppressed"
          no_prior_access_female:
            path: "parts.part_3.metrics.no_prior_access.segments.female.value"
            fmt: "pct"
            suppressed_path: "parts.part_3.metrics.no_prior_access.segments.female.suppressed"
          no_prior_access_male:
            path: "parts.part_3.metrics.no_prior_access.segments.male.value"
            fmt: "pct"
            suppressed_path: "parts.part_3.metrics.no_prior_access.segments.male.suppressed"
        note: >
          This is a market-reach / financial-inclusion metric: the share of surveyed
          clients who had no insurance of any kind before joining VisionFund (i.e.
          VisionFund was their first insurer). Frame it as extending financial
          protection to previously-uninsured households -- this is distinct from,
          and should not be confused with, the financial-stress/coping metrics
          elsewhere in this part.

      s3_1:
        label: "Financial Stress and Coping"
        word_limit: 80
        metrics:
          negative_coping:
            path: "parts.part_3.metrics.negative_coping.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.negative_coping.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.negative_coping.headline.suppressed"
            population: "Clients who experienced an insurable event in the last 12 months -- this includes both those who filed a claim and those who did not; it is not the same as 'claimants' alone"
            components_path: "parts.part_3.metrics.negative_coping.components"
            suppressed_components_path: "parts.part_3.metrics.negative_coping.suppressed_components"
          financial_stress_high:
            path: "parts.part_3.metrics.financial_stress_high.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.financial_stress_high.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.financial_stress_high.headline.suppressed"
            population: "All surveyed clients -- this question is asked of everyone regardless of claim or insurable-event status; it is not conditional on having filed a claim or even having experienced an insurable event"
          alternative_access_difficult:
            path: "parts.part_3.metrics.alternative_access_difficult.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.alternative_access_difficult.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.alternative_access_difficult.headline.suppressed"
        note: >
          negative_coping and financial_stress_high describe two different populations (see
          each metric's population above) -- never say "claimants" for either one, and never
          present them as if measured on the same group. financial_stress_high in particular
          must not be framed as occurring "after a claim" or as a consequence of claiming --
          it is an independent question, unrelated to claim activity, and should be reported
          as a standalone finding about the client base as a whole, not paired with or implied
          to follow from negative_coping. alternative_access_difficult is measured on the full
          sample. negative_coping is a plain percentage (share of respondents who reported at
          least one severe coping behavior, a yes/no flag) -- it is NOT measured on any kind of
          scale, so never describe it as "a scale," "on a scale where lower/higher means...," or
          similar. financial_stress_high is derived from a 1-5 source scale internally (used only
          to decide direction; higher source values are worse), but this must never be exposed
          or referenced in the narrative text -- state each percentage and what it means in plain
          language, with no mention of scales, coding, or methodology.

          negative_coping's [components: ...] value, when present, names the specific severe
          coping behaviour(s) respondents actually used (e.g. "sold assets or livestock"),
          ranked by how common they were, plus a count of any further behaviour too small to
          name without risking identifying a specific respondent. State the most common named
          behaviour in the narrative (e.g. "most commonly, clients sold assets or livestock")
          rather than reporting negative_coping as a bare percentage with no behaviour attached.
          If a component was suppressed, say how many were suppressed and why (too few
          respondents to name safely) -- do not guess at or invent what a suppressed behaviour
          might have been, and do not name a behaviour with an n not given in [components: ...].
          If [components: ...] is entirely absent, say only that a share of clients used a
          severe coping strategy, with no invented behaviour. Use the phrase "insurable
          event", never "insured event" -- the survey asks whether the client experienced an
          event that MIGHT be covered, not one already determined to be covered.

      s3_2:
        label: "Confidence in Payout"
        word_limit: 70
        metrics:
          confidence_pay:
            path: "parts.part_3.metrics.confidence_pay.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.confidence_pay.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.confidence_pay.headline.suppressed"
        note: >
          worth_premium (product value / worth-the-premium) is already reported in Part 1
          and must not be repeated or referenced here -- this section is about confidence
          that VisionFund will pay a valid claim, not about premium value.

      insight:
        word_limit: 120
        verbatim_section: "part3"

  # ───────────────────────────────────────────────────────────────────
  # PART 4 — Client Voice (NPS & Themes)
  # ───────────────────────────────────────────────────────────────────
  part_4:
    title: "Client Voice"
    visuals:
      - file: "part4_nps.png"
        caption: "Net Promoter Score"
      - file: "part4_themes.png"
        caption: "Top NPS Themes"
    sections:
      s4_1:
        label: "Net Promoter Score"
        word_limit: 90
        metrics:
          nps_score:
            path: "parts.part_4.nps.result.value"
            fmt: "nps"
            n_path: "parts.part_4.nps.result.n_valid"
            suppressed_path: "parts.part_4.nps.result.suppressed"
          nps_promoter_n:
            path: "parts.part_4.nps.result.promoters.n"
            fmt: "count"
          nps_promoter_pct:
            path: "parts.part_4.nps.result.promoters.pct"
            fmt: "pct"
          nps_passive_n:
            path: "parts.part_4.nps.result.passives.n"
            fmt: "count"
          nps_passive_pct:
            path: "parts.part_4.nps.result.passives.pct"
            fmt: "pct"
          nps_detractor_n:
            path: "parts.part_4.nps.result.detractors.n"
            fmt: "count"
          nps_detractor_pct:
            path: "parts.part_4.nps.result.detractors.pct"
            fmt: "pct"
        qualitative_keys:
          - "not_worth_it_themes"
        note: >
          not_worth_it_themes from qualitative identifies why clients who rated the
          premium as 'not worth it' (worth_premium_value >= 4) feel this way.
          Mention top 1-2 themes if available.

      s4_2:
        label: "Promoter and Detractor Themes"
        word_limit: 90
