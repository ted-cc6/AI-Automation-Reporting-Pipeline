# generation/report_spec.yaml
# Maps each report section to analysis data paths and generation parameters.

schema_version: "1.0"
run_id_default: "2026_Q2"
output_filename: "VFI_Insurance_Impact_Report_2026_Q2.docx"
model: "Claude Opus 4.8"

parts:
  # ───────────────────────────────────────────────────────────────────
  # PART 1 — Product Understanding & Awareness
  # ───────────────────────────────────────────────────────────────────
  part_1:
    title: "Product Understanding & Awareness"
    visuals:
      - file: "part1_coverage_bar.png"
        caption: "Coverage Understanding by Segment"
      - file: "part1_claims_process_bar.png"
        caption: "Claims Process Understanding by Segment"
    sections:
      s1_1:
        label: "Coverage Understanding"
        word_limit: 90
        metrics:
          coverage_understanding:
            path: "parts.part_1.metrics.coverage_understanding.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.coverage_understanding.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.headline.suppressed"
          coverage_understanding_female:
            path: "parts.part_1.metrics.coverage_understanding.segments.female.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.segments.female.suppressed"
          coverage_understanding_male:
            path: "parts.part_1.metrics.coverage_understanding.segments.male.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.segments.male.suppressed"
          coverage_understanding_claimant:
            path: "parts.part_1.metrics.coverage_understanding.segments.claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.segments.claimant.suppressed"
          coverage_understanding_non_claimant:
            path: "parts.part_1.metrics.coverage_understanding.segments.non_claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.coverage_understanding.segments.non_claimant.suppressed"

      s1_2:
        label: "Claim Process Understanding"
        word_limit: 90
        metrics:
          claim_process_understanding:
            path: "parts.part_1.metrics.claim_process_understanding.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.claim_process_understanding.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.headline.suppressed"
          claim_process_understanding_female:
            path: "parts.part_1.metrics.claim_process_understanding.segments.female.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.segments.female.suppressed"
          claim_process_understanding_male:
            path: "parts.part_1.metrics.claim_process_understanding.segments.male.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.segments.male.suppressed"
          claim_process_understanding_claimant:
            path: "parts.part_1.metrics.claim_process_understanding.segments.claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.segments.claimant.suppressed"
          claim_process_understanding_non_claimant:
            path: "parts.part_1.metrics.claim_process_understanding.segments.non_claimant.value"
            fmt: "pct"
            suppressed_path: "parts.part_1.metrics.claim_process_understanding.segments.non_claimant.suppressed"

      s1_2b:
        label: "Preferred Claims Channel"
        word_limit: 70
        metrics:
          channel_preferred_base:
            path: "parts.part_1.claim_channel_preferred.n_base"
            fmt: "count"
        distribution_path: "parts.part_1.claim_channel_preferred.distribution"
        note: >
          This question asks which channel clients PREFER for submitting a claim -- it is
          asked of every respondent regardless of whether they have ever filed a claim.
          It is NOT a record of how any specific claim was actually filed, and must not be
          described as such. Use language like "clients prefer" or "would like to use" --
          never "filed through", "submitted via", or "used".

      s1_3:
        label: "Product Value and Renewal Intent"
        word_limit: 80
        metrics:
          worth_premium:
            path: "parts.part_1.metrics.worth_premium.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.worth_premium.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.worth_premium.headline.suppressed"
            population: "Health & credit-life clients across the African country programmes only — Vietnam's crop-insurance clients pay no premium (grant-subsidized) and were not asked this question"
          renewal_intent:
            path: "parts.part_1.metrics.renewal_intent.headline.value"
            fmt: "pct"
            n_path: "parts.part_1.metrics.renewal_intent.headline.n_valid"
            suppressed_path: "parts.part_1.metrics.renewal_intent.headline.suppressed"
            population: "Vietnam's crop-insurance clients only — this question is not asked of health or credit-life clients in any country"
        note: >
          worth_premium and renewal_intent describe two entirely separate, non-overlapping
          groups of respondents (see each metric's population above) — never contrast them
          as if describing the same clients, and do not use transition words like "however"
          between them. State each finding on its own with its stated population.

      insight:
        word_limit: 120
        verbatim_section: "part1"

  # ───────────────────────────────────────────────────────────────────
  # PART 2 — Claims Experience
  # ───────────────────────────────────────────────────────────────────
  part_2:
    title: "Claims Experience"
    visuals:
      - file: "part2_funnel.png"
        caption: "Claims Funnel"
      - file: "part2_no_claim_reasons.png"
        caption: "Reasons for Not Claiming"
      - file: "part2_claim_challenges.png"
        caption: "Top Claims Challenges (% of claimants who challenged)"
    sections:
      s2_1:
        label: "Claims Funnel"
        word_limit: 100
        metrics:
          n_surveyed:
            path: "parts.part_2.claims_funnel.experienced_event.n_total"
            fmt: "count"
          n_experienced_event:
            path: "parts.part_2.claims_funnel.experienced_event.n"
            fmt: "count"
          pct_experienced_event:
            path: "parts.part_2.claims_funnel.experienced_event.pct_of_total"
            fmt: "pct"
          n_filed_claim:
            path: "parts.part_2.claims_funnel.filed_claim.n"
            fmt: "count"
          pct_filed_of_event:
            path: "parts.part_2.claims_funnel.filed_claim.pct_of_event_base"
            fmt: "pct"
          leakage_rate:
            path: "parts.part_2.claims_funnel.filed_claim.leakage"
            fmt: "pct"
          n_claim_paid:
            path: "parts.part_2.claims_funnel.claim_paid.n"
            fmt: "count"
          pct_claim_paid:
            path: "parts.part_2.claims_funnel.claim_paid.pct_of_claimants"
            fmt: "pct"
        funnel_table:
          headers: ["Stage", "N", "Rate"]
          rows:
            - label: "Experienced insured event"
              n_key: "n_experienced_event"
              rate_key: "pct_experienced_event"
            - label: "Filed a claim"
              n_key: "n_filed_claim"
              rate_key: "pct_filed_of_event"
            - label: "Claim paid"
              n_key: "n_claim_paid"
              rate_key: "pct_claim_paid"

      s2_2:
        label: "Reasons for Not Claiming"
        word_limit: 70
        metrics:
          no_claim_reasons_base:
            path: "parts.part_2.no_claim_reasons.n_base"
            fmt: "count"
        distribution_path: "parts.part_2.no_claim_reasons.distribution"
        qualitative_keys:
          - "other_subthemes.claim_no_reason_other"

      s2_3:
        label: "Claim Challenges"
        word_limit: 80
        metrics:
          challenges_base:
            path: "parts.part_2.claim_challenges.n_base"
            fmt: "count"
        distribution_path: "parts.part_2.claim_challenges.ranked.ranked"
        qualitative_keys:
          - "other_subthemes.claim_challenges_other_support"
          - "protection_flags"
        note: "If any protection_flags were found, surface them briefly in this section."

      s2_4:
        label: "Payout Outcomes"
        word_limit: 100
        metrics:
          claim_result_base:
            path: "parts.part_2.claim_result.n_base"
            fmt: "count"
          payout_cost_base:
            path: "parts.part_2.payout_cost_coverage.n_base"
            fmt: "count"
        distribution_path: "parts.part_2.claim_result.distribution"
        extra_distributions:
          payout_cost_coverage: "parts.part_2.payout_cost_coverage.distribution"

      insight:
        word_limit: 120
        verbatim_section: "part2"

  # ───────────────────────────────────────────────────────────────────
  # PART 3 — Financial Inclusion
  # ───────────────────────────────────────────────────────────────────
  part_3:
    title: "Financial Inclusion"
    visuals:
      - file: "part3_financial_protection.png"
        caption: "Financial Protection Indicators"
    sections:
      s3_0:
        label: "Reaching Clients with No Prior Insurance Access"
        word_limit: 70
        metrics:
          no_prior_access:
            path: "parts.part_3.metrics.no_prior_access.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.no_prior_access.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.no_prior_access.headline.suppressed"
          no_prior_access_female:
            path: "parts.part_3.metrics.no_prior_access.segments.female.value"
            fmt: "pct"
            suppressed_path: "parts.part_3.metrics.no_prior_access.segments.female.suppressed"
          no_prior_access_male:
            path: "parts.part_3.metrics.no_prior_access.segments.male.value"
            fmt: "pct"
            suppressed_path: "parts.part_3.metrics.no_prior_access.segments.male.suppressed"
        note: >
          This is a market-reach / financial-inclusion metric: the share of surveyed
          clients who had no insurance of any kind before joining VisionFund (i.e.
          VisionFund was their first insurer). Frame it as extending financial
          protection to previously-uninsured households -- this is distinct from,
          and should not be confused with, the financial-stress/coping metrics
          elsewhere in this part.

      s3_1:
        label: "Financial Stress and Coping"
        word_limit: 80
        metrics:
          negative_coping:
            path: "parts.part_3.metrics.negative_coping.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.negative_coping.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.negative_coping.headline.suppressed"
            population: "Clients who experienced an insured event in the last 12 months -- this includes both those who filed a claim and those who did not; it is not the same as 'claimants' alone"
          financial_stress_high:
            path: "parts.part_3.metrics.financial_stress_high.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.financial_stress_high.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.financial_stress_high.headline.suppressed"
            population: "All surveyed clients -- this question is asked of everyone regardless of claim or insured-event status; it is not conditional on having filed a claim or even having experienced an insured event"
          alternative_access_difficult:
            path: "parts.part_3.metrics.alternative_access_difficult.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.alternative_access_difficult.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.alternative_access_difficult.headline.suppressed"
        note: >
          negative_coping and financial_stress_high describe two different populations (see
          each metric's population above) -- never say "claimants" for either one, and never
          present them as if measured on the same group. financial_stress_high in particular
          must not be framed as occurring "after a claim" or as a consequence of claiming --
          it is an independent question, unrelated to claim activity, and should be reported
          as a standalone finding about the client base as a whole, not paired with or implied
          to follow from negative_coping. alternative_access_difficult is measured on the full
          sample. negative_coping is a plain percentage (share of respondents who reported at
          least one severe coping behavior, a yes/no flag) -- it is NOT measured on any kind of
          scale, so never describe it as "a scale," "on a scale where lower/higher means...," or
          similar. financial_stress_high is derived from a 1-5 source scale internally (used only
          to decide direction; higher source values are worse), but this must never be exposed
          or referenced in the narrative text -- state each percentage and what it means in plain
          language, with no mention of scales, coding, or methodology.

      s3_2:
        label: "Confidence in Payout"
        word_limit: 70
        metrics:
          confidence_pay:
            path: "parts.part_3.metrics.confidence_pay.headline.value"
            fmt: "pct"
            n_path: "parts.part_3.metrics.confidence_pay.headline.n_valid"
            suppressed_path: "parts.part_3.metrics.confidence_pay.headline.suppressed"
        note: >
          worth_premium (product value / worth-the-premium) is already reported in Part 1
          and must not be repeated or referenced here -- this section is about confidence
          that VisionFund will pay a valid claim, not about premium value.

      insight:
        word_limit: 120
        verbatim_section: "part3"

  # ───────────────────────────────────────────────────────────────────
  # PART 4 — Client Voice (NPS & Themes)
  # ───────────────────────────────────────────────────────────────────
  part_4:
    title: "Client Voice"
    visuals:
      - file: "part4_nps.png"
        caption: "Net Promoter Score"
      - file: "part4_themes.png"
        caption: "Top NPS Theme Drivers"
    sections:
      s4_1:
        label: "Net Promoter Score"
        word_limit: 90
        metrics:
          nps_score:
            path: "parts.part_4.nps.result.value"
            fmt: "nps"
            n_path: "parts.part_4.nps.result.n_valid"
            suppressed_path: "parts.part_4.nps.result.suppressed"
          nps_promoter_n:
            path: "parts.part_4.nps.result.promoters.n"
            fmt: "count"
          nps_promoter_pct:
            path: "parts.part_4.nps.result.promoters.pct"
            fmt: "pct"
          nps_passive_n:
            path: "parts.part_4.nps.result.passives.n"
            fmt: "count"
          nps_passive_pct:
            path: "parts.part_4.nps.result.passives.pct"
            fmt: "pct"
          nps_detractor_n:
            path: "parts.part_4.nps.result.detractors.n"
            fmt: "count"
          nps_detractor_pct:
            path: "parts.part_4.nps.result.detractors.pct"
            fmt: "pct"
        qualitative_keys:
          - "not_worth_it_themes"
        note: >
          not_worth_it_themes from qualitative identifies why clients who rated the
          premium as 'not worth it' (worth_premium_value >= 4) feel this way.
          Mention top 1-2 themes if available.

      s4_2:
        label: "Promoter and Detractor Themes"
        word_limit: 90
        qualitative_keys:
          - "theme_counts.promoters"
          - "theme_counts.detractors"
        note: >
          theme_counts are Python-counted from Gemini's compact NPS tag arrays.
          Report top 3 promoter themes and top 3 detractor themes by count.

      s4_3:
        label: "Drivers of Satisfaction"
        word_limit: 90
        metrics:
          nps_headline:
            path: "parts.part_4.nps.result.value"
            fmt: "nps"
            n_path: "parts.part_4.satisfaction_drivers.n_base"
        drivers:
          financial_stress:
            rho_path: "parts.part_4.satisfaction_drivers.drivers.financial_stress.value"
            p_path: "parts.part_4.satisfaction_drivers.drivers.financial_stress.p_value"
            n_path: "parts.part_4.satisfaction_drivers.drivers.financial_stress.n_valid"
            suppressed_path: "parts.part_4.satisfaction_drivers.drivers.financial_stress.suppressed"
            direction: "Raw code: 1=stress significantly reduced (best) to 5=significantly increased (worst); NPS runs 0=worst to 10=best. A negative rho here means lower financial stress correlates with a higher NPS — a positive real-world relationship, despite the negative sign."
          coverage_understanding:
            rho_path: "parts.part_4.satisfaction_drivers.drivers.coverage_understanding.value"
            p_path: "parts.part_4.satisfaction_drivers.drivers.coverage_understanding.p_value"
            n_path: "parts.part_4.satisfaction_drivers.drivers.coverage_understanding.n_valid"
            suppressed_path: "parts.part_4.satisfaction_drivers.drivers.coverage_understanding.suppressed"
            direction: "Raw code: 1=very good understanding (best) to 4=very poor (worst); NPS runs 0=worst to 10=best. A negative rho here means better coverage understanding correlates with a higher NPS — a positive real-world relationship, despite the negative sign."
          claim_process_understanding:
            rho_path: "parts.part_4.satisfaction_drivers.drivers.claim_process_understanding.value"
            p_path: "parts.part_4.satisfaction_drivers.drivers.claim_process_understanding.p_value"
            n_path: "parts.part_4.satisfaction_drivers.drivers.claim_process_understanding.n_valid"
            suppressed_path: "parts.part_4.satisfaction_drivers.drivers.claim_process_understanding.suppressed"
            direction: "Raw code: 1=very good understanding (best) to 4=very poor (worst); NPS runs 0=worst to 10=best. A negative rho here means better claims-process understanding correlates with a higher NPS — a positive real-world relationship, despite the negative sign."
          worth_premium:
            rho_path: "parts.part_4.satisfaction_drivers.drivers.worth_premium.value"
            p_path: "parts.part_4.satisfaction_drivers.drivers.worth_premium.p_value"
            n_path: "parts.part_4.satisfaction_drivers.drivers.worth_premium.n_valid"
            suppressed_path: "parts.part_4.satisfaction_drivers.drivers.worth_premium.suppressed"
            population: "Health & credit-life clients only — Vietnam's crop-insurance clients were not asked this question, so they are excluded from this correlation"
            direction: "Raw code: 1=definitely worth it (best) to 5=definitely not worth it (worst); NPS runs 0=worst to 10=best. A negative rho here means feeling the premium is worth it correlates with a higher NPS — a positive real-world relationship, despite the negative sign."
          renewal_intent:
            rho_path: "parts.part_4.satisfaction_drivers.drivers.renewal_intent.value"
            p_path: "parts.part_4.satisfaction_drivers.drivers.renewal_intent.p_value"
            n_path: "parts.part_4.satisfaction_drivers.drivers.renewal_intent.n_valid"
            suppressed_path: "parts.part_4.satisfaction_drivers.drivers.renewal_intent.suppressed"
            population: "Vietnam's crop-insurance clients only — its lower N compared to other drivers reflects this smaller population, not suppressed/missing data — not asked of health or credit-life clients in any country"
            direction: "Raw code: 1=definitely would renew (best) to 5=definitely would not renew (worst); NPS runs 0=worst to 10=best. A negative rho here means STRONGER renewal intent correlates with a HIGHER NPS — a positive real-world relationship. Do not describe this as renewal intent being bad for satisfaction; the negative sign is an artifact of the 1=best coding, not a negative finding."
          confidence_pay:
            rho_path: "parts.part_4.satisfaction_drivers.drivers.confidence_pay.value"
            p_path: "parts.part_4.satisfaction_drivers.drivers.confidence_pay.p_value"
            n_path: "parts.part_4.satisfaction_drivers.drivers.confidence_pay.n_valid"
            suppressed_path: "parts.part_4.satisfaction_drivers.drivers.confidence_pay.suppressed"
            direction: "Raw code: 1=very confident (best) to 5=not confident at all (worst); NPS runs 0=worst to 10=best. A negative rho here means higher confidence correlates with a higher NPS — a positive real-world relationship, despite the negative sign."
        drivers_table:
          headers: ["Driver", "ρ (Spearman)", "p-value", "N"]
          scale_note: >
            Note: ρ (rho) is the Spearman rank correlation coefficient, a value from -1 to +1
            showing how strongly two things move together -- values near +1 or -1 indicate a
            strong relationship, values near 0 indicate little to none. Spearman correlation is
            calculated on the rank order of responses rather than their raw values, which makes
            it well suited to Likert-scale survey questions like these. p (the p-value) shows how
            likely a correlation this strong could appear by chance alone if no real relationship
            existed; p<0.05 is the conventional threshold for statistical significance. N is the
            number of respondents included in each specific calculation -- it varies by driver
            because not every question was asked of every client (for example, Renewal Intent was
            asked only of Vietnam's crop-insurance clients). Financial Stress, Coverage
            Understanding, Claim Process Understanding, Worth Premium, Renewal Intent, and
            Confidence in Payout are all scored so that a LOWER number is the more positive
            response (e.g. 1 = "Definitely would renew"), while NPS runs the opposite way (0=worst,
            10=best). A negative correlation with NPS for any of these drivers therefore reflects a
            POSITIVE real-world relationship (e.g. stronger renewal intent aligns with a higher
            NPS), not a negative one.
        drivers_outcome_label: "client satisfaction (NPS)"
        note: >
          All correlations are Spearman rank correlations computed directly on q_nps_score
          (0-10) against each driver's raw ordinal code (Likert 1-5/1-4) -- no
          top_two_box/bottom_two_box transformation is applied, the same methodology Part 5
          uses for its Child Wellbeing Drivers table, just with NPS instead of child wellbeing
          as the outcome. Each driver's own [direction: ...] note above states what its sign
          means in plain English -- use that stated direction rather than assuming a negative
          rho is a negative finding. A driver with a null value in the JSON is suppressed --
          show "SUPPRESSED" in the table. worth_premium and renewal_intent each have a smaller
          N than the other drivers, reflecting their restricted populations (see each driver's
          population note above) -- do not describe this as missing or suppressed data.

      insight:
        word_limit: 120
        verbatim_section: "part4"

  # ───────────────────────────────────────────────────────────────────
  # PART 5 — Child Wellbeing
  # ───────────────────────────────────────────────────────────────────
  part_5:
    title: "Child Wellbeing"
    visuals:
      - file: "part5_drivers.png"
        caption: "Child Wellbeing Drivers (Spearman Correlation)"
      - file: "part5_healthcare.png"
        caption: "Healthcare Access and Medical Cost Impact"
    scorecard_metrics:
      - key: financial_stress_high
        label: "High Financial Stress"
        fmt: "pct"
        caregiver_path: "parts.part_5.caregiver_comparison.metrics.financial_stress_high.caregiver.value"
        non_caregiver_path: "parts.part_5.caregiver_comparison.metrics.financial_stress_high.non_caregiver.value"
        sig_path: "parts.part_5.caregiver_comparison.metrics.financial_stress_high.significance.p_value"
        caregiver_sup: "parts.part_5.caregiver_comparison.metrics.financial_stress_high.caregiver.suppressed"
        non_caregiver_sup: "parts.part_5.caregiver_comparison.metrics.financial_stress_high.non_caregiver.suppressed"
        population: "All surveyed clients (same base as Part 3's financial stress metric) — not restricted to those who experienced an insured event"
      - key: healthcare_access
        label: "Healthcare Access Improved"
        fmt: "pct"
        caregiver_path: "parts.part_5.caregiver_comparison.metrics.healthcare_access.caregiver.value"
        non_caregiver_path: "parts.part_5.caregiver_comparison.metrics.healthcare_access.non_caregiver.value"
        sig_path: "parts.part_5.caregiver_comparison.metrics.healthcare_access.significance.p_value"
        caregiver_sup: "parts.part_5.caregiver_comparison.metrics.healthcare_access.caregiver.suppressed"
        non_caregiver_sup: "parts.part_5.caregiver_comparison.metrics.healthcare_access.non_caregiver.suppressed"
        population: "Health-insurance clients who needed care (same base as Part 4's healthcare access metric)"
    sections:
      s5_1:
        label: "Child Wellbeing Drivers"
        word_limit: 90
        metrics:
          cwb_headline:
            path: "parts.part_4.child_wellbeing.headline.value"
            fmt: "pct"
            n_path: "parts.part_4.child_wellbeing.headline.n_valid"
        drivers:
          financial_stress:
            rho_path: "parts.part_5.drivers.financial_stress.value"
            p_path: "parts.part_5.drivers.financial_stress.p_value"
            n_path: "parts.part_5.drivers.financial_stress.n_valid"
            suppressed_path: "parts.part_5.drivers.financial_stress.suppressed"
            direction: "Raw code: 1=stress significantly reduced (best) to 5=significantly increased (worst). A negative rho here means higher stress correlates with lower child wellbeing — the expected, negative real-world relationship."
          coverage_understanding:
            rho_path: "parts.part_5.drivers.coverage_understanding.value"
            p_path: "parts.part_5.drivers.coverage_understanding.p_value"
            n_path: "parts.part_5.drivers.coverage_understanding.n_valid"
            suppressed_path: "parts.part_5.drivers.coverage_understanding.suppressed"
            direction: "Raw code: 1=very good understanding (best) to 4=very poor (worst). A negative rho here means better coverage understanding correlates with better child wellbeing — a positive real-world relationship, despite the negative sign."
          claim_process_understanding:
            rho_path: "parts.part_5.drivers.claim_process_understanding.value"
            p_path: "parts.part_5.drivers.claim_process_understanding.p_value"
            n_path: "parts.part_5.drivers.claim_process_understanding.n_valid"
            suppressed_path: "parts.part_5.drivers.claim_process_understanding.suppressed"
            direction: "Raw code: 1=very good understanding (best) to 4=very poor (worst). A negative rho here means better claims-process understanding correlates with better child wellbeing — a positive real-world relationship, despite the negative sign."
          worth_premium:
            rho_path: "parts.part_5.drivers.worth_premium.value"
            p_path: "parts.part_5.drivers.worth_premium.p_value"
            n_path: "parts.part_5.drivers.worth_premium.n_valid"
            suppressed_path: "parts.part_5.drivers.worth_premium.suppressed"
            population: "Health & credit-life clients only — Vietnam's crop-insurance clients were not asked this question, so they are excluded from this correlation"
            direction: "Raw code: 1=definitely worth it (best) to 5=definitely not worth it (worst). A negative rho here means feeling the premium is worth it correlates with better child wellbeing — a positive real-world relationship, despite the negative sign."
          renewal_intent:
            rho_path: "parts.part_5.drivers.renewal_intent.value"
            p_path: "parts.part_5.drivers.renewal_intent.p_value"
            n_path: "parts.part_5.drivers.renewal_intent.n_valid"
            suppressed_path: "parts.part_5.drivers.renewal_intent.suppressed"
            population: "Vietnam's crop-insurance clients only — its lower N compared to other drivers (each driver's N is shown alongside it above) reflects this smaller population, not suppressed/missing data — not asked of health or credit-life clients in any country"
            direction: "Raw code: 1=definitely would renew (best) to 5=definitely would not renew (worst). A negative rho here means STRONGER renewal intent correlates with BETTER child wellbeing — a positive real-world relationship. Do not describe this as renewal intent being bad for wellbeing; the negative sign is an artifact of the 1=best coding, not a negative finding."
          confidence_pay:
            rho_path: "parts.part_5.drivers.confidence_pay.value"
            p_path: "parts.part_5.drivers.confidence_pay.p_value"
            n_path: "parts.part_5.drivers.confidence_pay.n_valid"
            suppressed_path: "parts.part_5.drivers.confidence_pay.suppressed"
            direction: "Raw code: 1=very confident (best) to 5=not confident at all (worst). A negative rho here means higher confidence correlates with better child wellbeing — a positive real-world relationship, despite the negative sign."
          nps_score:
            rho_path: "parts.part_5.drivers.nps_score.value"
            p_path: "parts.part_5.drivers.nps_score.p_value"
            n_path: "parts.part_5.drivers.nps_score.n_valid"
            suppressed_path: "parts.part_5.drivers.nps_score.suppressed"
            direction: "Raw score: 0=worst to 10=best (NOT reverse-coded, unlike the other drivers here). A positive rho here means higher NPS correlates with better child wellbeing — the sign and the real-world relationship point the same direction."
        drivers_table:
          headers: ["Driver", "ρ (Spearman)", "p-value", "N"]
          scale_note: >
            Note: ρ (rho) is the Spearman rank correlation coefficient, a value from -1 to +1
            showing how strongly two things move together -- values near +1 or -1 indicate a
            strong relationship, values near 0 indicate little to none. Spearman correlation is
            calculated on the rank order of responses rather than their raw values, which makes
            it well suited to Likert-scale survey questions like these. p (the p-value) shows how
            likely a correlation this strong could appear by chance alone if no real relationship
            existed; p<0.05 is the conventional threshold for statistical significance, and the
            very small p-values shown below mean these relationships are highly unlikely to be
            due to chance. N is the number of respondents included in each specific calculation --
            it varies by driver because not every question was asked of every client (for
            example, Renewal Intent was asked only of Vietnam's crop-insurance clients).
            Financial Stress, Coverage Understanding, Claim Process Understanding, Worth
            Premium, Renewal Intent, and Confidence in Payout are all scored so that a LOWER
            number is the more positive response (e.g. 1 = "Definitely would renew"). A negative
            correlation with child wellbeing for any of these therefore reflects a POSITIVE
            real-world relationship (e.g. stronger renewal intent aligns with better wellbeing),
            not a negative one. NPS Score runs the opposite way (0=worst, 10=best), so a positive
            correlation there likewise reflects a positive relationship.
        note: >
          All correlations are Spearman rank correlations computed directly on each question's
          raw ordinal code (Likert 1-5/1-4, or NPS 0-10) — no top_two_box/bottom_two_box
          transformation is applied in this section (unlike the Part 6/7 scorecards, which do
          transform these same questions into % positive-response figures; do not assume the two
          calculations use the same input values).
          Each driver's own [direction: ...] note above states what its sign means in plain
          English — use that stated direction rather than assuming a negative rho is a negative
          finding; several of these are negative precisely because the underlying scale runs
          1=best. A driver with a null value in the JSON is suppressed — show "SUPPRESSED" in
          the table.
          The worth_premium driver's lower N compared to other drivers (each driver's N is shown
          alongside it above) reflects its smaller population (see worth_premium's population
          note) — do not describe this as missing or suppressed data.

      s5_2:
        label: "Healthcare Access and Medical Cost"
        word_limit: 80
        metrics:
          healthcare_access:
            path: "parts.part_4.healthcare_access.headline.value"
            fmt: "pct"
            n_path: "parts.part_4.healthcare_access.headline.n_valid"
            suppressed_path: "parts.part_4.healthcare_access.headline.suppressed"
          medical_cost_change:
            path: "parts.part_4.medical_cost_change.headline.value"
            fmt: "pct"
            n_path: "parts.part_4.medical_cost_change.headline.n_valid"
            suppressed_path: "parts.part_4.medical_cost_change.headline.suppressed"
            population: "Health-insurance clients who needed medical care -- this is asked of everyone in this group regardless of whether they filed an insurance claim; only a small minority of these respondents are actual claimants, so this group must never be called 'claimants' or described as 'after claim'"
        note: >
          healthcare_access: % who said access to care improved (among those who needed care).
          medical_cost_change: % who said medical costs decreased (among health clients who needed
          medical care) -- this is NOT limited to claimants and must not be framed as
          happening "after a claim" or "after receiving their insurance claim"; it is a general
          medical-cost question asked of anyone in this group who needed care, independent of
          claim status. Do not say "claimants" anywhere in this section.

      s5_3:
        label: "Caregivers vs Non-Caregivers"
        word_limit: 80
        note: >
          Compares caregivers (support at least one child) against non-caregivers on financial
          stress and healthcare access -- two metrics unrelated to child wellbeing itself, since
          child wellbeing cannot be measured for non-caregivers. See the scorecard table's
          population note for each row's base. Significance threshold: p < 0.05, mark with *.

      insight:
        word_limit: 120
        verbatim_section: "part5"

