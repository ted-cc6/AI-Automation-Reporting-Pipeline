          Any row with its own population note in the scorecard table describes a further
          restricted population on top of that shared insurable-event base; do not imply the
          same clients answered every row. The Net Promoter Score row is tested differently
          from every other row (see that row's note); do not describe it as "significant" or
          "not significant" using the same p<0.05-chi-squared framing as the % rows; state
          its own p-value/test if mentioning it. Child Wellbeing Improved uses a narrower
          population than the rest of the table (see its population note); do not imply it
          was asked of every claimant / did-not-file respondent.
