        note: >
          This table's two groups are "Claimant (filed)" and "Did not file" -- a note stating
          both are restricted to clients who experienced an insurable event in the past 12
          months already appears beneath the table in the rendered report; do not restate it
          as your own sentence, but let it govern how you write about the two groups. This is
          NOT a comparison against clients who never had a claimable event at all; do not
          describe or imply that "Did not file" means "never claimed", and never contrast its
          figures against a portfolio-wide or whole-sample number computed over everyone (e.g.
          the portfolio NPS in the Executive Summary/Part 4) as if they described the same
          population. Refer to the two groups as "Claimant (filed)" and "Did not file" in your
          own prose; do not use "Non-Filer" or "Non-Claimant" -- both were tried in earlier
          reports and retracted for implying the wrong population.

