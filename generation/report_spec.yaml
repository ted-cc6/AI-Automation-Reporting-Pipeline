        sig_path: "parts.part_7.metrics.worth_premium.significance.p_value"
        female_sup: "parts.part_7.metrics.worth_premium.female.suppressed"
        male_sup: "parts.part_7.metrics.worth_premium.male.suppressed"
        # Scope-conditional -- see the identical note on Part 1's worth_premium metric.
        population:
          default: "Health & credit-life clients only, within each gender group; Vietnam's crop-insurance clients were not asked this question"
          lacro: null
      - key: renewal_intent
        label: "Renewal Intent"
        fmt: "pct"
        female_path: "parts.part_7.metrics.renewal_intent.female.value"
        male_path: "parts.part_7.metrics.renewal_intent.male.value"
        sig_path: "parts.part_7.metrics.renewal_intent.significance.p_value"
        female_sup: "parts.part_7.metrics.renewal_intent.female.suppressed"
        male_sup: "parts.part_7.metrics.renewal_intent.male.suppressed"
        population: "Vietnam's crop-insurance clients only, within each gender group; not asked of health or credit-life clients in any country"
      - key: negative_coping
        label: "Negative Coping (↓ better)"
        fmt: "pct"
        female_path: "parts.part_7.metrics.negative_coping.female.value"
        male_path: "parts.part_7.metrics.negative_coping.male.value"
        sig_path: "parts.part_7.metrics.negative_coping.significance.p_value"
        female_sup: "parts.part_7.metrics.negative_coping.female.suppressed"
        male_sup: "parts.part_7.metrics.negative_coping.male.suppressed"
      - key: child_wellbeing
        label: "Child Wellbeing Improved"
        fmt: "pct"
        female_path: "parts.part_7.metrics.child_wellbeing.female.value"
        male_path: "parts.part_7.metrics.child_wellbeing.male.value"
        sig_path: "parts.part_7.metrics.child_wellbeing.significance.p_value"
        female_sup: "parts.part_7.metrics.child_wellbeing.female.suppressed"
        male_sup: "parts.part_7.metrics.child_wellbeing.male.suppressed"
      - key: confidence_pay
        label: "Confidence in Payout"
        fmt: "pct"
        female_path: "parts.part_7.metrics.confidence_pay.female.value"
        male_path: "parts.part_7.metrics.confidence_pay.male.value"
        sig_path: "parts.part_7.metrics.confidence_pay.significance.p_value"
        female_sup: "parts.part_7.metrics.confidence_pay.female.suppressed"
        male_sup: "parts.part_7.metrics.confidence_pay.male.suppressed"
    sections:
      narrative:
        word_limit: 100
        note: >
          Significance threshold: p < 0.05 = statistically significant, mark with *.
          The female sample is the large majority of respondents; note this if relevant.
          Any row with its own population note in the scorecard table describes a
          restricted population; do not imply the same clients answered every row.
      insight:
        word_limit: 120
        verbatim_section: "part7"

  # ───────────────────────────────────────────────────────────────────
  # PART 9 — Additional Services (LARCO only, see run_analysis.py's
  # build_sections() -- never included for Africa/Vietnam runs, whose
  # equivalent q_bundled_services_used/q_services_helped questions exist
  # but are ~0.4% filled, effectively unused)
  # ───────────────────────────────────────────────────────────────────
  part_9:
    title: "Additional Services"
    visuals:
      - file: "part9_services_used.png"
        caption: "Additional Services Used"
    sections:
      s9_1:
        label: "Services Used"
        word_limit: 90
        metrics:
          services_used_base:
            path: "parts.part_9.services_used.n_base"
            fmt: "count"
        distribution_path: "parts.part_9.services_used.headline.ranked"
        note: >
          Non-claim benefits bundled with the insurance product (teleconsultation,
          face-to-face consultations, discounted/free medicines, lab tests, health events)
          -- distinct from the claims-payout benefits covered elsewhere in this report.
          The distribution is measured on the FULL surveyed population, not just clients
          who used a service -- explicitly state this denominator in your sentence (e.g.
          "among all N surveyed clients," using services_used_base) rather than leaving it
          implied, since a reader could otherwise assume the percentages are out of service
          users only. Report the actual distribution shown in the data without
          characterizing whether the level of "None"/no-response is high, low, expected,
          or concerning -- that judgment belongs to the reader, not this narrative. If the
          distribution is empty, state plainly that this module wasn't part of this
          dataset's survey rather than speculating about service usage or inventing a
          reason for zero data. A coded theme summary of any "Other, please specify"
          responses to this question is not yet available in this dataset -- do not
          reference or speculate about "Other" responses for this section.

      s9_2:
        label: "Service Helpfulness"
        word_limit: 70
        metrics:
          services_helped:
            path: "parts.part_9.services_helped.headline.value"
            fmt: "pct"
            n_path: "parts.part_9.services_helped.headline.n_valid"
            suppressed_path: "parts.part_9.services_helped.headline.suppressed"
            population: "Only clients who used at least one additional service (see Services Used above) -- this question was not asked of clients who used none"
        note: >
          services_helped is the share who found the service(s) they used helpful as
          wanted, among only the (typically small) group who used at least one -- explicitly
          state this denominator in your sentence (e.g. "among the N clients who used at
          least one service," using this metric's own n) rather than leaving it implied, and
          never imply this figure describes the full survey population.

      insight:
        word_limit: 120
        verbatim_section: "part9"

  # ───────────────────────────────────────────────────────────────────
  # PART 10 — Trend Comparison (second-wave comparison against a prior
  # run's own snapshot, any schema -- see analysis_engine/sections/
  # part_10.py and run_analysis.py's --prior-run-id/build_sections())
  # ───────────────────────────────────────────────────────────────────
  part_10:
    title: "Trend Comparison"
    visuals:
      - file: "part10_trend.png"
        caption: "Wave-over-Wave Trend"
    # Consumed by generation/orchestrator.py's _build_trend_data() -- each
    # indicator's current/prior values already live pre-computed in
    # analysis_results.json's parts.part_10 block (see part_10.py), so this
    # list only needs key/label/fmt, not per-metric JSON paths like every
    # other part's `metrics:` block.
    trend_indicators:
      - key: first_time_access
        label: "First-Time Access to Insurance"
        fmt: "pct"
      - key: access_to_alternatives
        label: "Access to Alternatives (Difficult)"
        fmt: "pct"
      - key: child_wellbeing_improvement
        label: "Child Wellbeing Improvement"
        fmt: "pct"
      - key: client_satisfaction_nps
        label: "Client Satisfaction (NPS)"
        fmt: "nps"
      - key: product_understanding
        label: "Product Understanding"
        fmt: "pct"
    sections:
      narrative:
        word_limit: 130
        metrics:
          # NOT new_country_n -- writer.py's _build_sections_text() drops any
          # metric key ending in "_n" on purpose (it means "the n-count for
          # the metric named before the suffix," e.g. healthcare_access +
          # healthcare_access_n), so a STANDALONE metric actually named
          # new_country_n was silently invisible to the model entirely --
          # the real cause of the "new_country_n clients" literal-text bug
          # this note works around below, caught by rebuilding this exact
          # prompt against real data and finding the metric simply missing.
          new_country_count:
            path: "parts.part_10.sample_composition.n_new_country"
            fmt: "count"
          new_country_share:
            path: "parts.part_10.sample_composition.new_country_share"
            fmt: "pct"
        note: >
          State the sample composition change ONCE, near the start of this section, before
          any indicator's figures: using the new_country_count and new_country_share VALUES
          given above (not their key names -- those are data labels, not words to use in
          your sentence), write one sentence such as "The Dominican Republic is new to this
          wave, contributing 270 clients (15.7% of this wave's sample) with no 2025-wave
          counterpart." -- substituting the real numbers, not the literal text
          "new_country_count" or "new_country_share". Do not repeat this fact for each
          indicator below.

          Compares this wave's 5 headline indicators against a prior wave's own snapshot
          of the same 5 indicators (see the TREND TABLE). If TREND AVAILABLE is false,
          state plainly and neutrally, in one sentence, that no prior wave is available for
          comparison yet -- do not describe or imply a trend that doesn't exist, and do not
          call this wave a "founding baseline," "the founding wave," or use any similar
          self-important framing implying historic significance; it is simply the case that
          no earlier comparable wave has been loaded for this dataset yet.

          product_understanding's Current Wave value may itself read NOT APPLICABLE (not
          merely NOT COMPARABLE) when this wave's survey format has no single combined
          question to compute it from -- the 2026 unified instrument instead asks two
          separate questions (coverage understanding, claims-process understanding), both
          reported at length in Part 1. If product_understanding's Current Wave value is
          NOT APPLICABLE, say so in one sentence pointing to Part 1's two split metrics --
          never state or imply that product understanding "was not asked of this
          population," since related understanding questions were asked and reported
          elsewhere in this report, just not in the single-combined-question format this
          specific indicator is defined from.

          Only 2 of the 5 indicators (first_time_access, client_satisfaction_nps) are
          actually comparable between waves -- the survey instrument changed for the other
          3. A row whose "Prior Wave" table value reads "NOT COMPARABLE" has a table note
          stating why (a changed question, scale, or option set) -- present that
          indicator's Current Wave figure as a NEW BASELINE ONLY, in one sentence
          mentioning the instrument change from its table note. NEVER use a comparative
          verb (rose, fell, improved, declined, increased, decreased, up, down, since last
          year) for a NOT COMPARABLE row -- this is a hard rule, not a style preference.

          For the 2 comparable indicators, the delta/significance test was computed on the
          five countries surveyed in both waves, NOT on the Current Wave figure shown in
          the table (which is this wave's full six-country figure, matching every other
          number in this report) -- each comparable row's table note states the
          five-country figure the test actually used; use THAT number, not the table's
          Current Wave column, when stating the delta (e.g. "NPS is +48.3 across LACRO. On
          the five countries surveyed in both waves it is +46.2, against +36.3 in 2025." --
          not "NPS rose from 36.3 to 48.3").

          client_satisfaction_nps is a POINT delta (NPS runs -100 to +100), not a
          percentage-point delta like the other four indicators -- never call an NPS
          change "percentage points." product_understanding is defined as the single most
          positive response option only (a stricter bar than a typical top-2-box), so do
          not describe it as "top-2-box" or imply a broader definition. Significance
          threshold: p < 0.05 = statistically significant, mark with *; the NPS row has no
          significance test (see the table note) since NPS isn't a proportion -- do not
          describe an NPS row as "significant" or "not significant" using the same framing
          as the other rows. This comparison is between two INDEPENDENT cross-sectional
          survey waves -- each wave is its own fresh random sample of clients, not the same
          individuals tracked over time -- so never describe a comparable indicator's
          change as something that happened "to" clients or use language implying a panel/
          longitudinal study (e.g. not "clients' understanding improved" but "understanding
          was higher among this wave's respondents"). If a comparable row's table note also
          says "DEFINITION MISMATCH," state plainly that its comparison may not be
          apples-to-apples between waves and do not draw a conclusion from its delta.
      insight:
        word_limit: 120
        verbatim_section: "part10"

  # ───────────────────────────────────────────────────────────────────
  # PART 11 — Credit Life Module (africa report_scope only, see
  # run_analysis.py's build_sections() -- Enhanced Credit Life is an
  # Africa-only product; LACRO's insurance_type is 100% Health)
  # ───────────────────────────────────────────────────────────────────
  part_11:
    title: "Credit Life Module"
    sections:
      s11_1:
        label: "Other Benefits Used"
        word_limit: 90
        metrics:
          other_benefits_base:
            path: "parts.part_11.other_benefits_used.n_base"
            fmt: "count"
            population: "Enhanced Credit Life clients only -- not asked of Health or Crop insurance clients"
        distribution_path: "parts.part_11.other_benefits_used.headline.ranked"
        note: >
          Non-loan-payoff benefits bundled with the Enhanced Credit Life product (help
          with medical costs, weather-affected income, damaged property) -- distinct from
          the base loan-payoff cover and from the claims-payout benefits covered elsewhere
          in this report. The distribution is measured on ALL Credit Life clients, not a
          subset -- explicitly state this denominator in your sentence (e.g. "among all N
          Enhanced Credit Life clients," using other_benefits_base) rather than leaving it
          implied. Report the actual distribution shown in the data without characterizing
          it as high, low, expected, or concerning -- that judgment belongs to the reader.

      s11_2:
        label: "Value of Additional Benefits"
        word_limit: 90
        metrics:
          awareness:
            path: "parts.part_11.additional_value.awareness.value"
            fmt: "pct"
            n_path: "parts.part_11.additional_value.awareness.n_valid"
            suppressed_path: "parts.part_11.additional_value.awareness.suppressed"
            population: "Enhanced Credit Life clients only"
          valuable_share:
            path: "parts.part_11.additional_value.valuable_share.result.value"
            fmt: "pct"
            n_path: "parts.part_11.additional_value.valuable_share.result.n_valid"
            suppressed_path: "parts.part_11.additional_value.valuable_share.result.suppressed"
            population: "Only Credit Life clients who are aware of the additional benefits (see awareness above) -- clients who said they are not aware did not rate a value, so are excluded from this denominator"
        note: >
          Two separate, non-overlapping findings, each with its own base -- do not
          contrast them as if describing the same clients. awareness is the share of ALL
          Credit Life clients who are aware these additional benefits exist (base:
          other_benefits_base). valuable_share is the share who rate them "Very valuable"
          or "Somewhat valuable" AMONG ONLY the aware subgroup (a smaller base than
          awareness's own -- state this subgroup's own N in your sentence, e.g. "among the
          N clients aware of these benefits," never implying it is out of all Credit Life
          clients).

      insight:
        word_limit: 120
        verbatim_section: "part11"

  # ───────────────────────────────────────────────────────────────────
  # PART 12 — Crop Module (africa report_scope only, see run_analysis.py's
  # build_sections() -- crop insurance is a Vietnam-only product; every
  # metric in this part MUST be labelled Vietnam crop clients only)
  # ───────────────────────────────────────────────────────────────────
  part_12:
    title: "Crop Module"
    sections:
      s12_1:
        label: "Weather-Shock Recovery"
        word_limit: 90
        metrics:
          recovery_speed:
            path: "parts.part_12.recovery_speed.value"
            fmt: "pct"
            n_path: "parts.part_12.recovery_speed.n_valid"
            suppressed_path: "parts.part_12.recovery_speed.suppressed"
            population: "Vietnam's crop-insurance clients only -- crop insurance is not sold in any other country in this report's scope"
        note: >
          Share of crop-insurance clients who recovered and continued earning income
          within 3 months of a weather shock, since having the insurance. This is a
          Vietnam-only product -- state this population explicitly in your sentence (e.g.
          "among Vietnam's N crop-insurance clients") rather than describing it as if it
          applied to the wider surveyed population.

      s12_2:
        label: "Farming Approach Change"
        word_limit: 90
        metrics:
          farming_change:
            path: "parts.part_12.farming_change.value"
            fmt: "pct"
            n_path: "parts.part_12.farming_change.n_valid"
            suppressed_path: "parts.part_12.farming_change.suppressed"
            population: "Vietnam's crop-insurance clients only -- crop insurance is not sold in any other country in this report's scope"
        note: >
          Share of crop-insurance clients whose farming approach (choice of crops, input
          investment, or planting practices) has improved since having crop insurance.
          Same Vietnam-only population as Weather-Shock Recovery above -- state this
          explicitly, do not imply it describes the wider surveyed population.

      insight:
        word_limit: 120
        verbatim_section: "part12"
