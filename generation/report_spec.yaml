            direction: "Raw code: 1=definitely would renew (best) to 5=definitely would not renew (worst). A negative rho here means STRONGER renewal intent is associated with BETTER child wellbeing, an association in the expected direction. Do not describe this as renewal intent being bad for wellbeing; the negative sign is an artifact of the 1=best coding, not a negative finding."
          confidence_pay:
