# value_coding_map.yaml — VisionFund Insurance Survey 2026
# Generated: 2026-06-25  |  Reviewed: ___________________
#
# Direction convention for Likert integers:
#   a=1, b=2, c=3, d=4, e=5  — constant across all Likert questions.
#   For positive-framed questions (coverage_understanding, worth_premium,
#   confidence_pay, renewal_intent): lower int = more positive response.
#   For financial_stress: lower int = more stress reduction (better outcome).
#
# All raw values are copied verbatim from the Phase A profile report.
# Any raw value NOT listed here will trigger a WARNING in the transformer
# and be left as NaN in the output — the script will not crash.

# ---------------------------------------------------------------------------
# 1. Insurance type routing
# ---------------------------------------------------------------------------
insurance_type_routing:
  "Health Insurance": health
  "Enhanced Credit Life": credit_life
  "Crop Insurance": crop

# ---------------------------------------------------------------------------
# 2. Scope rules
# ---------------------------------------------------------------------------
# Which columns are exclusive to a given insurance type is now recorded per-row
# in column_mapping.csv's `scope` field (health_only / crop_only /
# credit_life_only), not as a positional index list here — that field survives
# column reordering; a raw_index list here would not.
scope_rules:
  # Sentinel written to cells that are empty BECAUSE of routing, not because
  # the respondent skipped. Distinct from NaN (genuine skip).
  sentinel: "__SCOPE_NA__"

# ---------------------------------------------------------------------------
# 3. Likert-4  (cols 11, 12 — coverage & claim-process understanding)
# ---------------------------------------------------------------------------
# Scale note: 1=best (Very good) → 4=worst (Very poor)
likert_4:
  "a. Very good": {int: 1, label: "Very good"}
  "b. Good":      {int: 2, label: "Good"}
  "c. Poor":      {int: 3, label: "Poor"}
  "d. Very poor": {int: 4, label: "Very poor"}

# ---------------------------------------------------------------------------
# 4. Likert-5  (one block per question — labels differ)
# ---------------------------------------------------------------------------
# Scale note: a=1 (most positive / most reduced) → e=5 (least positive / most increased)
likert_5:

  # col 63 — How much does the insurance help reduce your financial stress?
  # Scale: 1=Significantly reduced (best) → 5=Significantly increased (worst)
  q_financial_stress:
    "a. Significantly reduced":   {int: 1, label: "Significantly reduced"}
    "b. Somewhat reduced":        {int: 2, label: "Somewhat reduced"}
    "c. No effect":               {int: 3, label: "No effect"}
    "d. Somewhat increased":      {int: 4, label: "Somewhat increased"}
    "e. Significantly increased": {int: 5, label: "Significantly increased"}

  # col 79 — Is the insurance worth what you pay?
  # Scale: 1=Definitely worth it (best) → 5=Definitely not worth it (worst)
  q_worth_premium:
    "a. Definitely worth it":               {int: 1, label: "Definitely worth it"}
    "b. Somewhat worth it":                 {int: 2, label: "Somewhat worth it"}
    "c. Neither worth it nor not worth it": {int: 3, label: "Neither worth it nor not worth it"}
    "d. Somewhat not worth it":             {int: 4, label: "Somewhat not worth it"}
    "e. Definitely not worth it":           {int: 5, label: "Definitely not worth it"}

  # col 80 — Would you renew? (crop-scoped; 700,000 VND/hectare framing)
  # Scale: 1=Definitely would renew (best) → 5=Definitely would not renew (worst)
  q_renewal_intent:
    "a. Definitely would renew":     {int: 1, label: "Definitely would renew"}
    "b. Probably would renew":       {int: 2, label: "Probably would renew"}
    "c. Not sure":                   {int: 3, label: "Not sure"}
    "d. Probably would not renew":   {int: 4, label: "Probably would not renew"}
    "e. Definitely would not renew": {int: 5, label: "Definitely would not renew"}

  # col 81 — How confident are you that the insurance will pay?
  # Scale: 1=Very confident (best) → 5=Not confident at all (worst)
  q_confidence_pay:
    "a. Very confident":                     {int: 1, label: "Very confident"}
    "b. Somewhat confident":                 {int: 2, label: "Somewhat confident"}
    "c. Neither confident nor not confident": {int: 3, label: "Neither confident nor not confident"}
    "d. Somewhat not confident":             {int: 4, label: "Somewhat not confident"}
    "e. Not confident at all":               {int: 5, label: "Not confident at all"}

# ---------------------------------------------------------------------------
# 5. Binary standalone questions (NOT multi-select children)
# ---------------------------------------------------------------------------
# Affects: q_insured_event_12m (25), q_claim_submitted (26),
#          q_claim_challenges_experienced (31), q_prior_access (83)
binary_standalone:
  "a. Yes": true
  "b. No":  false

# ---------------------------------------------------------------------------
# 6. Multi-select child encoding
# ---------------------------------------------------------------------------
# Affects: all columns with category = multi_select_child
# Values "1"/"0" are string-encoded in the raw CSV
multi_select_child:
  "1": true
  "0": false

# ---------------------------------------------------------------------------
# 7. Multi-select option labels
# ---------------------------------------------------------------------------
# Maps each parent question_ref → option letter → clean display label.
# Used to populate the derived list-valued column (step 2f).
# Labels strip the "a. " prefix from the CSV column header suffix.
multi_select_option_labels:

  # cols 14–20 — Which communication channel is most effective?
  q_comm_channel_effective:
    a: "In-person explanation from MFI staff/loan officer"
    b: "Group meeting"
    c: "SMS/WhatsApp messages from the MFI"
    d: "Printed materials (leaflets, posters, brochures)"
    e: "Phone call from the MFI"
    f: "Email from the MFI"
    g: "Other"

  # cols 33–38 — What challenges did you experience with the claim process?
  q_claim_challenges:
    a: "Claim documents were difficult to collect from hospitals or authorities"
    b: "Claim documents were difficult to submit"
    c: "It was difficult to know the status of the claim once documents were submitted"
    d: "It took a long time to receive the claim amount"
    e: "I did not receive enough support or guidance on the claim process"
    f: "Other"

  # cols 42–49 — Because of the event, did you have to do any of the following?
  # Note: raw CSV has typo "Sell assests" — using corrected label here
  q_coping_mechanisms:
    a: "Use savings"
    b: "Borrow money"
    c: "Sell assets or livestock"
    d: "Reduce food consumption or essential spending"
    e: "Take children out of school"
    f: "Closed business temporarily"
    g: "None of the above"
    h: "Other"

  # cols 53–59 — Which of the following services did you use in the past 12 months?
  # NOTE: Only ~9 respondents (~0.4% fill) — effectively empty in this dataset.
  q_bundled_services_used:
    a: "Teleconsultation - doctor by phone (general or specialized)"
    b: "Face to face consultations (general or specialized)"
    c: "Access to medicines (discounts or free)"
    d: "Lab examination/lab test"
    e: "Health events (mobile clinic, orange ambulance, medical brigades, etc.)"
    f: "None"
    g: "Other"

  # cols 66–72 — What improved for your children since having the insurance product?
  q_child_improvements:
    a: "Improved access to healthcare treatment and diagnosis"
    b: "Reduced out-of-pocket expenses that helped us maintain nutritious and sufficient meals"
    c: "Fewer school days missed due to improved health"
    d: "Reduced need to work extra hours after a shock, allowing more time to spend with children"
    e: "Ability to continue normal daily activities (play, social life, learning)"
    f: "Increased savings after loss helped meet the children's needs including clothing, shoes, and school supplies"
    g: "Other"

  # cols 93–97 — Besides death/disability, which other benefits are included?
  # (Credit Life respondents only)
  q_credit_other_benefits:
    a: "Help with medical or hospital costs"
    b: "Help when crops or income are affected by weather (drought, flood, etc.)"
    c: "Help when property or business assets are damaged"
    d: "No other benefits are included"
    e: "I am not sure"

  # cols 106–111 — Which VisionFund services have you received in the last 6 months?
  q_vf_services_received:
    a: "Loans"
    b: "Savings Accounts"
    c: "Financial Education"
    d: "Health Services (telemedicine, education etc.)"
    e: "None"
    f: "Other"

  # cols 114–121 — What are your main sources of income?
  # Note: raw CSV has typo "assitance" in /g — corrected in label
  q_income_sources:
    a: "Crop agriculture business"
    b: "Livestock agriculture business"
    c: "Trading/Wholesale/Retail (e.g., retail shop)"
    d: "Manufacturing (e.g., maker of furniture)"
    e: "Service provision business (e.g., salon, skilled/casual laborer, or transport business)"
    f: "Salaried wage-earner"
    g: "Remittances, donations, and government subsidy/assistance"
    h: "Other"

# ---------------------------------------------------------------------------
# 8. Single-select prefix stripping
# ---------------------------------------------------------------------------
# Default rule (applied in the transformer): strip the leading "X. " prefix
# (where X is any lowercase letter a–z) from every single-select value.
# List here only columns that need an explicit note or non-obvious treatment.
single_select_strip_prefix:

  # q_sex: explicitly documented because spec calls it out
  # "a. Male" → "Male", "b. Female" → "Female"
  q_sex:
    "a. Male":   "Male"
    "b. Female": "Female"

  # q_child_wellbeing: 3-option (not binary) — has "c. Do not support any children"
  # which strips to "Do not support any children". Treat as Categorical not bool.
  q_child_wellbeing:
    "a. Yes":                        "Yes"
    "b. No":                         "No"
    "c. Do not support any children": "Do not support any children"

  # q_disability: 3-option — has "c. Don't know". Treat as Categorical not bool.
  q_disability:
    "a. Yes":       "Yes"
    "b. No":        "No"
    "c. Don't know": "Don't know"

  # q_healthcare_access: health-only, 3-option
  q_healthcare_access:
    "a. Yes":                                                "Yes"
    "b. No":                                                 "No"
    "c. Not applicable (I/my family have not needed medical care)": "Not applicable (I/my family have not needed medical care)"

  # q_no_claim_reason: option "b." absent from data;
  # profile shows distinct_count=6 — potential rare 6th value will trigger WARNING
  q_no_claim_reason:
    "a. The loss was not significant":      "The loss was not significant"
    "c. I did not know how to file a claim": "I did not know how to file a claim"
    "d. Claim process is cumbersome":        "Claim process is cumbersome"
    "e. I was not covered at that time":     "I was not covered at that time"
    "f. Other (please specify)":             "Other (please specify)"

  # q_claim_channel_preferred: option "b." absent from data;
  # profile shows distinct_count=6 — potential rare 6th value will trigger WARNING
  q_claim_channel_preferred:
    "a. Through an MFI officer coming to collect the documents": "Through an MFI officer coming to collect the documents"
    "c. Whatsapp or other messages applications":                "Whatsapp or other messages applications"
    "d. Directly at VisionFund office/ counter":                 "Directly at VisionFund office/ counter"
    "e. Through the insurer smartphone application":             "Through the insurer smartphone application"
    "f. Other (please specify)":                                 "Other (please specify)"

  # q_alternative_access: option "e." absent from data;
  # profile shows distinct_count=6 — potential rare 6th value will trigger WARNING
  q_alternative_access:
    "a. Very difficult":           "Very difficult"
    "b. Slightly difficult":       "Slightly difficult"
    "c. Neither difficult nor easy": "Neither difficult nor easy"
    "d. Slightly easy":            "Slightly easy"
    "f. I don't know":             "I don't know"

  # q_medical_cost_change: health-only; option "e." absent from data;
  # profile shows distinct_count=6 — potential rare 6th value will trigger WARNING
  q_medical_cost_change:
    "a. Much lower":                                      "Much lower"
    "b. Slightly lower":                                  "Slightly lower"
    "c. No difference":                                   "No difference"
    "d. Slightly higher":                                 "Slightly higher"
    "f. Not applicable (I have not needed medical care)": "Not applicable (I have not needed medical care)"

  # q_credit_additional_value: credit-life-only; option "d." absent from data;
  # profile shows distinct_count=6 — potential rare 6th value will trigger WARNING
  q_credit_additional_value:
    "a. Very valuable":                           "Very valuable"
    "b. Somewhat valuable":                       "Somewhat valuable"
    "c. Neither valuable nor not valuable":       "Neither valuable nor not valuable"
    "e. Not valuable at all":                     "Not valuable at all"
    "f. I am not aware of the additional benefits": "I am not aware of the additional benefits"

  # Remaining single-selects use the standard strip rule without exceptions
  # q_claim_result (col 29): a–e, all options present
  # q_payout_cost_coverage (col 30): a–c, all options present
  # q_services_helped (col 61): a–d, all options present
  # q_crop_recovery_speed (col 89): a–c, all options present
  # q_crop_farming_change (col 90): a–d, all options present
  # q_client_education (col 101): a–e, all options present
  # q_household_size (col 102): a–c, all options present

# ---------------------------------------------------------------------------
# 9. Column renames — keep_metadata, keep_identity, and free-text overrides
# ---------------------------------------------------------------------------
# Output names now live in column_mapping.csv's `output_name` field (per-row,
# survives reordering) instead of here. keep_metadata/keep_identity columns
# are always renamed via that field. free_text_child columns default to
# `{parent_ref}__other_text` (see Step k in the transformer) unless
# column_mapping.csv sets an explicit output_name override — e.g. col 40
# (q_claim_challenges__support_text), which would otherwise collide with
# col 39's default name since both share parent_ref=q_claim_challenges.

# ---------------------------------------------------------------------------
# 10. Notes — reviewer guidance
# ---------------------------------------------------------------------------
notes:
  q_bundled_services_used: >
    Only ~9 respondents (~0.4% fill). Transformation is valid but do not draw
    conclusions from this section. Most children have all-zero values.

  q_renewal_intent: >
    Vietnam/crop-specific question (references 700,000 VND/hectare). Fill rate
    7.0% matches Crop Insurance respondent count. Treated as crop-scoped;
    other respondents receive __SCOPE_NA__ sentinel.

  q_child_improvements: >
    Multi-select parent has 32.0% fill — conditional on q_child_wellbeing = 'Yes'.
    The parent concatenated-string column is dropped after list derivation.
    Children contain 675 rows with data (those who said Yes to child wellbeing).

  multi_select_parents_dropped: >
    After step 2f (list derivation), the original KoBoToolbox concatenated-string
    columns for all multi-select parents are dropped. The children (bool) and the
    derived list columns are the authoritative sources.

  absent_options_note: >
    Several single-select questions have absent option letters in the observed data:
    q_no_claim_reason (no 'b'), q_claim_channel_preferred (no 'b'),
    q_alternative_access (no 'e'), q_medical_cost_change (no 'e'),
    q_credit_additional_value (no 'd'). The transformer will log a WARNING for
    any value not in this map — the distinct_count=6 anomaly in the profile
    suggests at least one unlisted value may appear in a handful of rows.

  likert_direction: >
    All Likert integers follow a=1..e=5. For positive-framed questions
    (worth_premium, confidence_pay, renewal_intent, coverage_understanding,
    claim_process_understanding) a lower integer means a better/more positive
    response. For financial_stress a lower integer means more stress reduction
    (better). Analysts should document the direction in any scoring or aggregation.
