# insurance-report-spec.yaml
# Schema: urn:visionfund:insurance-report-spec:v1.0  (template_version: "2.0")
# Parts 4 and 7 are fully specified.
# Parts 1, 2, 3, 5, 6 are stubbed (fill_mode: bespoke, notes: "same pattern — to be specified").
# Benchmarks are OUT OF SCOPE for this version; benchmark_comparison and benchmark_overlay are not used.
# Regions are omitted — to be set per deployment context (regions is optional in the schema).

report_metadata:
  name: "VisionFund Insurance Impact Report 2026"
  template_version: "2.0"
  priority_segments:
    - female
    - male
    - claimant
    - non_claimant
  notes: >
    Priority segments per scope decision: female, male, claimant, non_claimant.
    Regions omitted — set at deployment time. Benchmark functionality is out of
    scope for this version; no benchmark_comparison metrics or benchmark_overlay
    flags are used anywhere in this spec.

