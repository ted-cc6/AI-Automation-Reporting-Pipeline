country: honduras
label: Honduras
report_context: >
  LARCO (Latin America and Caribbean) country. From the 2026 wave onward,
  submits the same unified Africa/Vietnam survey instrument as every other
  country (data_loader/ schema, dataset_schema="africa_vietnam") -- no
  Honduras-specific segment/metric nuances confirmed yet. A 2025 wave also
  exists under the older, differently-worded LARCO instrument
  (data_loader_larco/ schema, dataset_schema="larco"), used only as a
  Part 10 trend-comparison baseline against 2026+ runs. That older
  instrument had no disability screener question, but this file
  deliberately does NOT restate that as a pwd segment_override: the 2026
  schema DOES have q_disability, so a hardcoded override here would
  wrongly suppress the PWD segment on 2026 runs. On a "larco"-schema run
  of the 2025 data, analysis_engine/segments.py's required-column check
  already degrades pwd to empty/skipped automatically when q_disability is
  absent -- no override needed for that case either.

segment_overrides: {}
